<!-- hand-written approximation of the gemini.google.com composer region, 2026-10-12; no captured personal data -->
<main>
  <bard-mode-switcher><button type="button" data-test-id="bard-mode-menu-button" aria-haspopup="menu"><span class="label">3.8 Flash</span></button></bard-mode-switcher>
  <div class="input-area-container" style="font-family: 'Google Sans', sans-serif; font-size: 16px; color: rgb(227,227,227); background: rgb(30,31,32); border-radius: 24px;">
    <rich-textarea><div class="ql-editor textarea" contenteditable="true" role="textbox" aria-label="Enter a prompt here" data-placeholder="Ask Gemini"><p></p></div></rich-textarea>
    <button type="button" class="send-button" aria-label="Send message"><span class="material-symbols">send</span></button>
  </div>
</main>
