<!-- trimmed from grok.com on 2026-10-12 (logged out); structure, roles and test ids kept, text stripped -->
<main>
  <div class="pb-14.5"><div class="relative z-10 ps-2.5 pe-3.5"><div>
    <div class="relative min-h-0" data-testid="chat-input">
      <div><div class="tiptap ProseMirror w-full px-2 bg-transparent" contenteditable="true" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="Ask Grok anything"><p></p></div></div>
      <textarea aria-hidden="true" style="display:none"></textarea>
      <div class="flex">
        <button type="button" data-slot="button" aria-label="Attach" data-testid="attach-button" aria-haspopup="menu"></button>
        <button type="button" data-slot="button" id="model-select-trigger" aria-label="Model: Fast" aria-haspopup="menu" aria-expanded="false" data-state="closed">Fast</button>
        <button class="group flex" type="submit" aria-label="Submit" data-testid="chat-submit"></button>
      </div>
    </div>
  </div></div></div>
</main>
