name: Site not working
description: The badge doesn't appear, or reads the wrong model, on a supported chat site
labels: [site]
body:
  - type: input
    id: site
    attributes: {label: Site, placeholder: "chatgpt.com"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What you see, description: "No badge at all? Wrong model name? Badge in the wrong place? Signed in or not?"}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "Euboulia 0.1.0, Chrome 155"}
    validations: {required: true}
  - type: markdown
    attributes:
      value: |
        Maintainers can fix most of these with a catalog update. If you can, run `npm run fixture -- <site>` from a clone and
        attach the file it writes after reading it: it strips conversation text, but check it anyway.
