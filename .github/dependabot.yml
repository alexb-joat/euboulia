version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Hold new releases for a week: most hijacked packages are pulled within days.
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      # codeql-action/init and /analyze must run the same version, so they update in one PR.
      codeql-action:
        patterns: ["github/codeql-action*"]
